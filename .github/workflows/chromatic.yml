name: '크로마틱으로 스토리북 배포'

# 이전에는 `on: push` 로 모든 브랜치에서 실행되어 Chromatic 스냅샷을 낭비했습니다.
# PR과 master 푸시로만 좁힙니다.
on:
  pull_request:
  push:
    branches: [master]

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소해 스냅샷을 아낍니다.
concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic이 베이스라인 비교를 위해 전체 히스토리를 필요로 합니다.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 별도 actions/cache 스텝 대신 setup-node 내장 캐시를 사용합니다.
          # 이전 설정은 yarn 프로젝트인데 npm 캐시 경로(~/.npm)를 캐싱해 사실상 무효였습니다.
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          onlyChanged: true
          exitZeroOnChanges: true
