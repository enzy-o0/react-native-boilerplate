name: '크로마틱으로 스토리북 배포'

# Phase 1에서 Storybook 7 설정과 의존성을 제거했으므로 이 워크플로는 현재 동작하지 않습니다.
# Phase 8(Storybook 10 + @storybook/react-native-web-vite 재구축)에서 되살립니다.
# 그때까지 PR마다 실패로 표시되지 않도록 자동 트리거를 끄고 수동 실행만 남깁니다.
#
# 복구 시 되돌릴 설정 (Phase 8):
# on:
#   pull_request:
#   push:
#     branches: [master]
on:
  workflow_dispatch:

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소해 스냅샷을 아낍니다.
concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic이 베이스라인 비교를 위해 전체 히스토리를 필요로 합니다.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 별도 actions/cache 스텝 대신 setup-node 내장 캐시를 사용합니다.
          # 이전 설정은 yarn 프로젝트인데 npm 캐시 경로(~/.npm)를 캐싱해 사실상 무효였습니다.
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          onlyChanged: true
          exitZeroOnChanges: true
